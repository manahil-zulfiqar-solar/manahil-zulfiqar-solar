@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.t1{animation:rise .9s ease-out .1s both}.t2{animation:rise .9s ease-out .35s both}.t3{animation:rise .9s ease-out .6s both}.t4{animation:rise .9s ease-out .85s both}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{animation:spin 60s linear infinite;transform-origin:0 0}
@keyframes flow{to{stroke-dashoffset:-40}}
.flow{stroke-dasharray:8 8;animation:flow 1.6s linear infinite}
</style>
